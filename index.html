<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>相生记 · 高保真原型</title>
<style>
  :root {
    --bg: #17120C;
    --bg-soft: #201913;
    --bg-card: #241C14;
    --gold: #C6A15B;
    --gold-soft: #A88A52;
    --ink: #EDE6DA;
    --muted: #8D857A;
    --line: rgba(198,161,91,0.18);
    --mu: #5E7A5A;
    --huo: #A84A3C;
    --tu: #A67C3D;
    --jin: #C6A15B;
    --shui: #3E5C76;
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    background: #0D0A06;
    font-family: "PingFang SC","Microsoft YaHei",sans-serif;
    color: var(--ink);
    display:flex; justify-content:center; align-items:flex-start;
    min-height:100dvh; padding: 32px 16px 64px;
  }
  .phone {
    width: 390px; background: var(--bg); border-radius: 44px;
    border: 1px solid rgba(198,161,91,0.25);
    box-shadow: 0 40px 80px -20px rgba(0,0,0,0.8), 0 0 0 8px #201a12;
    overflow: hidden; position: relative;
  }
  .screen { display:none; min-height: 720px; }
  .screen.active { display:block; }

  /* ============ 通用 ============ */
  .serif { font-family: "Noto Serif SC","Songti SC","SimSun",serif; }
  .topbar {
    display:flex; align-items:center; justify-content:space-between;
    padding: 18px 20px 10px;
  }
  .topbar .brand { font-size: 19px; letter-spacing: 6px; color: var(--ink); }
  .topbar .brand em { font-style:normal; color: var(--gold); }
  .topbar .mark { font-size: 11px; color: var(--muted); letter-spacing: 2px; }
  .back-btn {
    width:34px; height:34px; border-radius:50%; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; color:var(--gold);
    font-size:16px; cursor:pointer; background:transparent;
  }
  .back-btn:active { transform: scale(0.94); }

  /* ============ 首页：五行方位宫格 ============ */
  .hero {
    text-align:center; padding: 28px 20px 8px;
  }
  .hero .sub { font-size:11px; color:var(--gold); letter-spacing:8px; margin-bottom:10px; }
  .hero h1 { font-size: 34px; letter-spacing: 14px; font-weight: 600; }
  .hero .tagline { font-size: 12px; color: var(--muted); letter-spacing: 2px; margin-top: 12px; }

  .wuxing-grid {
    display:grid; grid-template-columns: 1fr 1.6fr 1fr; grid-template-rows: 1fr 1.4fr 1fr;
    gap: 8px; padding: 26px 20px 8px; aspect-ratio: 1/1.05;
  }
  .wx {
    border-radius: 14px; position:relative; cursor:pointer; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    border: 1px solid var(--line);
    transition: transform .3s var(--ease);
  }
  .wx:active { transform: scale(0.96); }
  .wx .zi { font-size: 34px; font-weight: 500; color: rgba(237,230,218,0.92); }
  .wx .en { font-size: 10px; letter-spacing: 3px; color: rgba(237,230,218,0.55); margin-top: 2px; }
  .wx .cnt { font-size: 10px; color: rgba(237,230,218,0.7); margin-top: 6px; }
  .wx.south { grid-column: 2; grid-row: 1; background: var(--huo); }
  .wx.east  { grid-column: 1; grid-row: 2; background: var(--mu); }
  .wx.center{ grid-column: 2; grid-row: 2; background: linear-gradient(160deg,#7A5A2A,#5C4420); border-color: rgba(198,161,91,0.45); }
  .wx.center .zi { font-size: 42px; }
  .wx.west  { grid-column: 3; grid-row: 2; background: var(--jin); }
  .wx.north { grid-column: 2; grid-row: 3; background: var(--shui); }
  .wx .corner { position:absolute; top:8px; right:10px; font-size:9px; letter-spacing:1px; color: rgba(237,230,218,0.6); }

  .section-title {
    display:flex; align-items:baseline; justify-content:space-between;
    padding: 22px 20px 12px;
  }
  .section-title h2 { font-size: 17px; letter-spacing: 3px; font-weight: 500; }
  .section-title span { font-size: 11px; color: var(--muted); letter-spacing: 1px; }

  .h-scroll { display:flex; gap:12px; padding: 0 20px 12px; overflow-x:auto; scrollbar-width:none; }
  .h-scroll::-webkit-scrollbar { display:none; }
  .h-card { flex: 0 0 148px; cursor:pointer; }
  .h-card .img {
    height: 148px; border-radius: 12px; background-size:cover; background-position:center;
    border: 1px solid var(--line); position:relative;
  }
  .h-card .img .tag {
    position:absolute; left:8px; top:8px; font-size:9px; letter-spacing:2px;
    background: rgba(23,18,12,0.75); color: var(--gold); padding:3px 8px; border-radius: 20px;
  }
  .h-card h3 { font-size: 13px; font-weight: 500; margin-top: 8px; letter-spacing: 1px; }
  .h-card .meta { font-size: 10px; color: var(--muted); margin-top: 3px; }
  .h-card .price { font-size: 13px; color: var(--gold); margin-top: 4px; font-weight: 500; }

  /* 手机全屏：手机上打开是完整 App 界面，电脑上是手机框预览 */
  @media (max-width: 480px) {
    body { padding: 0; background: var(--bg); }
    .phone {
      width: 100%; border-radius: 0; border: none;
      box-shadow: none; min-height: 100dvh;
    }
  }

  /* ============ 类目页 ============ */
  .cat-hero {
    padding: 26px 20px 18px; display:flex; align-items:center; gap: 16px;
    border-bottom: 1px solid var(--line);
  }
  .cat-hero .badge {
    width: 74px; height: 74px; border-radius: 50%; flex-shrink:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .cat-hero .badge .zi { font-size: 28px; color: rgba(237,230,218,0.95); }
  .cat-hero .badge .en { font-size: 9px; letter-spacing: 2px; color: rgba(237,230,218,0.7); margin-top:2px; }
  .cat-hero h1 { font-size: 24px; letter-spacing: 6px; font-weight: 500; }
  .cat-hero .note { font-size: 11px; color: var(--muted); margin-top: 6px; letter-spacing: 1px; line-height: 1.7; }
  .cat-hero .note b { color: var(--gold); font-weight: 500; }

  /* 筛选条 */
  .filters-bar { padding: 16px 20px 2px; display: flex; flex-direction: column; gap: 12px; }
  .f-row { display: flex; align-items: center; gap: 12px; }
  .f-lab { font-size: 11px; color: var(--gold); letter-spacing: 2px; flex-shrink: 0; width: 32px; }
  .f-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .f-chips::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; font-size: 11px; letter-spacing: 1px; padding: 5px 14px; border-radius: 20px;
    border: 1px solid var(--line); color: var(--muted); cursor: pointer; background: transparent;
    transition: all .2s var(--ease);
  }
  .chip.on { background: var(--gold); color: #17120C; border-color: var(--gold); font-weight: 600; }

  .prod-list { padding: 6px 20px 90px; display:flex; flex-direction:column; gap: 20px; }
  .empty { text-align: center; padding: 50px 0; color: var(--muted); font-size: 12px; letter-spacing: 2px; }
  .prod {
    display:flex; gap: 14px; cursor:pointer; padding-bottom: 18px;
    border-bottom: 1px solid rgba(198,161,91,0.10);
  }
  .prod:active { opacity: 0.8; }
  .prod .img { width: 104px; height: 128px; border-radius: 10px; background-size:cover; background-position:center; flex-shrink:0; border: 1px solid var(--line); }
  .prod .info { flex:1; display:flex; flex-direction:column; padding-top: 2px; }
  .prod .info h3 { font-size: 15px; font-weight: 500; letter-spacing: 1px; }
  .prod .info .mat { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .prod .info .tags { display:flex; gap:6px; margin-top: 8px; flex-wrap:wrap; }
  .prod .info .tags i {
    font-style:normal; font-size: 9px; letter-spacing:1px; padding: 2px 8px;
    border-radius: 20px; border: 1px solid var(--line); color: var(--gold-soft);
  }
  .prod .info .price { font-size: 15px; color: var(--gold); margin-top: auto; font-weight: 500; }

  /* ============ 详情页 ============ */
  .detail-img {
    height: 400px; background-size:cover; background-position:center;
    position: relative;
  }
  .detail-img .mask {
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(23,18,12,0.35) 0%, transparent 30%, transparent 55%, var(--bg) 100%);
  }
  .detail-top { position:absolute; top:0; left:0; right:0; z-index:2; padding: 18px 20px 0; display:flex; justify-content:space-between; }
  .detail-body { padding: 0 22px; }
  .detail-body .mat-line { font-size: 11px; letter-spacing: 2px; color: var(--gold); margin-bottom: 10px; }
  .detail-body h1 { font-size: 24px; letter-spacing: 4px; font-weight: 500; }
  .detail-body .wx-tags { display:flex; gap:8px; margin-top: 14px; }
  .detail-body .wx-tags i {
    font-style:normal; font-size: 10px; letter-spacing: 2px; padding: 4px 12px; border-radius: 20px;
    border: 1px solid var(--line); color: var(--ink);
  }
  .detail-body .wx-tags i.hot { background: var(--huo); border-color: var(--huo); color:#F3EAE0; }
  .detail-body .price-row { display:flex; align-items:baseline; gap: 12px; margin-top: 18px; }
  .detail-body .price-row .price { font-size: 26px; color: var(--gold); font-weight: 600; }
  .detail-body .price-row .stock { font-size: 10px; color: var(--muted); letter-spacing: 1px; }
  .detail-body .desc {
    font-size: 12px; color: var(--muted); line-height: 2; margin-top: 16px;
    border-top: 1px solid rgba(198,161,91,0.12); padding-top: 14px;
  }
  .huashu {
    margin: 18px 0 26px; background: var(--bg-card); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px 16px;
  }
  .huashu .label { font-size: 10px; color: var(--gold); letter-spacing: 3px; margin-bottom: 8px; }
  .huashu p { font-size: 12px; line-height: 1.9; color: var(--ink); }
  .copy-btn {
    width: 100%; padding: 15px 0; background: var(--gold); color: #17120C;
    border: none; border-radius: 12px; font-size: 15px; letter-spacing: 4px; font-weight: 600;
    cursor: pointer; transition: transform .2s var(--ease);
  }
  .copy-btn:active { transform: scale(0.97); }

  /* 我的 / 客户登记页 */
  .mine-body { padding: 10px 22px 100px; }
  .mine-body h2 { font-size: 17px; letter-spacing: 3px; font-weight: 500; margin: 20px 0 6px; }
  .mine-body .sub { font-size: 11px; color: var(--muted); margin-bottom: 16px; letter-spacing: 1px; line-height: 1.8; }
  .mine-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .mine-field label { font-size: 11px; color: var(--gold); letter-spacing: 2px; }
  .mine-field input, .mine-field select, .mine-field textarea {
    background: var(--bg-card); border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 14px; color: var(--ink); font-size: 13px; font-family: inherit; outline: none;
    transition: border-color .2s;
  }
  .mine-field input:focus, .mine-field select:focus, .mine-field textarea:focus { border-color: var(--gold); }
  .mine-field select option { background: var(--bg-card); }
  .mine-field textarea { resize: vertical; min-height: 60px; }
  .submit-btn {
    width: 100%; padding: 14px 0; background: var(--gold); color: #17120C; border: none;
    border-radius: 12px; font-size: 15px; letter-spacing: 4px; font-weight: 600;
    cursor: pointer; transition: transform .2s var(--ease);
  }
  .submit-btn:active { transform: scale(0.97); }
  .card-out {
    margin-top: 16px; background: var(--bg-card); border: 1px solid var(--gold);
    border-radius: 12px; padding: 14px 16px; display: none;
  }
  .card-out .card-text { font-size: 12px; line-height: 1.9; color: var(--ink); white-space: pre-wrap; }
  .mine-record {
    padding: 12px 0; border-bottom: 1px solid rgba(198,161,91,0.10);
    font-size: 12px; color: var(--muted); line-height: 1.8;
  }
  .mine-record b { color: var(--ink); font-weight: 500; }
  .calc-result {
    margin-top: 20px; text-align: center; background: var(--bg-card);
    border: 1px solid var(--line); border-radius: 16px; padding: 24px 18px;
  }
  .result-badge {
    width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 14px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .result-badge .zi { font-size: 36px; color: rgba(237,230,218,0.95); }
  .result-badge .en { font-size: 9px; letter-spacing: 2px; color: rgba(237,230,218,0.7); margin-top: 2px; }
  .result-name { font-size: 20px; letter-spacing: 3px; font-weight: 500; }
  .result-detail { font-size: 11px; color: var(--muted); line-height: 1.9; margin-top: 10px; letter-spacing: 1px; }
  .result-gems { margin-top: 12px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .result-gems i { font-style: normal; font-size: 11px; padding: 4px 12px; border-radius: 20px; border: 1px solid var(--gold); color: var(--gold); }
  .calc-result .submit-btn { margin-top: 14px; }
  .submit-btn.ghost { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
  .copy-tip {
    position: fixed; left:50%; top: 46%; transform: translateX(-50%);
    background: rgba(237,230,218,0.95); color: #17120C; font-size: 12px;
    padding: 10px 22px; border-radius: 30px; letter-spacing: 2px;
    opacity: 0; pointer-events: none; transition: opacity .3s var(--ease); z-index: 99;
  }
  .copy-tip.show { opacity: 1; }

  /* ============ 底部 Tab ============ */
  .tabbar {
    position: absolute; bottom: 0; left:0; right:0;
    display:flex; justify-content: space-around; align-items:center;
    padding: 10px 0 14px; background: rgba(23,18,12,0.92); backdrop-filter: blur(10px);
    border-top: 1px solid rgba(198,161,91,0.12);
  }
  .tabbar .tab { display:flex; flex-direction:column; align-items:center; gap:3px; font-size: 10px; color: var(--muted); letter-spacing:1px; cursor:pointer; }
  .tabbar .tab.on { color: var(--gold); }
  .tabbar .tab svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.5; }

  .page-note { text-align:center; font-size:11px; color:#6E675C; padding: 40px 0 10px; letter-spacing: 1px; }
</style>
</head>
<body>

<div class="phone" id="phone">
  <!-- ============ 屏1 首页 ============ -->
  <div class="screen active" id="screen-home">
    <div class="topbar">
      <div class="brand">相<em>生</em>记</div>
      <div class="mark">五行相生 · 本命珠玉</div>
    </div>
    <div class="hero">
      <div class="sub">金 木 水 火 土</div>
      <h1 class="serif">按五行 寻本命饰</h1>
      <div class="tagline">五行相生 · 一物一命</div>
    </div>

    <div class="wuxing-grid">
      <div class="wx south" data-cat="huo">
        <span class="corner">南</span>
        <span class="zi">火</span><span class="en">FIRE</span><span class="cnt">12 件</span>
      </div>
      <div class="wx east" data-cat="mu">
        <span class="corner">东</span>
        <span class="zi">木</span><span class="en">WOOD</span><span class="cnt">15 件</span>
      </div>
      <div class="wx center" data-cat="tu">
        <span class="corner">中</span>
        <span class="zi">土</span><span class="en">EARTH</span><span class="cnt">18 件</span>
      </div>
      <div class="wx west" data-cat="jin">
        <span class="corner">西</span>
        <span class="zi">金</span><span class="en">METAL</span><span class="cnt">21 件</span>
      </div>
      <div class="wx north" data-cat="shui">
        <span class="corner">北</span>
        <span class="zi">水</span><span class="en">WATER</span><span class="cnt">14 件</span>
      </div>
    </div>

    <div class="section-title">
      <h2 class="serif">精选</h2>
      <span>本月上新</span>
    </div>
    <div class="h-scroll" id="h-scroll"></div>
    <div class="page-note">原型 1/3 · 首页</div>
    <div class="tabbar">
      <div class="tab on" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>首页</div>
      <div class="tab" data-tab="cat"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>分类</div>
      <div class="tab" data-tab="mine"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>我的</div>
    </div>
  </div>

  <!-- ============ 屏2 类目页 ============ -->
  <div class="screen" id="screen-cat">
    <div class="topbar">
      <div class="back-btn" data-goto="home">‹</div>
      <div class="brand" style="font-size:15px; letter-spacing:4px;">相生记</div>
      <div style="width:34px"></div>
    </div>
    <div class="cat-hero" id="cat-hero"></div>
    <div class="filters-bar" id="filters-bar"></div>
    <div class="prod-list" id="prod-list"></div>
    <div class="tabbar">
      <div class="tab" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>首页</div>
      <div class="tab on" data-tab="cat"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>分类</div>
      <div class="tab" data-tab="mine"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>我的</div>
    </div>
  </div>

  <!-- ============ 屏3 详情页 ============ -->
  <div class="screen" id="screen-detail">
    <div class="detail-img" id="detail-img">
      <div class="mask"></div>
      <div class="detail-top">
        <div class="back-btn" data-goto="cat">‹</div>
        <div style="width:34px"></div>
      </div>
    </div>
    <div class="detail-body" id="detail-body"></div>
    <div class="tabbar" style="background:transparent; border-top:none;"></div>
  </div>

  <!-- ============ 屏4 我的 / 客户登记 ============ -->
  <div class="screen" id="screen-mine">
    <div class="topbar">
      <div class="brand" style="font-size:15px; letter-spacing:4px;">相生记</div>
      <div class="mark">五行测算</div>
    </div>
    <div class="mine-body">
      <h2 class="serif">五行测算</h2>
      <div class="sub">输入客户的出生年份，看他的五行本命，顺势推荐对应的宝贝。</div>
      <div class="mine-field">
        <label>出生年份</label>
        <input id="calc-year" type="number" min="1924" max="2043" placeholder="如：1990" inputmode="numeric">
      </div>
      <button class="submit-btn" id="btn-calc">算算我的五行</button>
      <div class="calc-result" id="calc-result" style="display:none">
        <div class="result-badge" id="result-badge">
          <span class="zi" id="result-zi">火</span>
          <span class="en" id="result-en">FIRE</span>
        </div>
        <div class="result-name" id="result-name">您属火</div>
        <div class="result-detail" id="result-detail"></div>
        <div class="result-gems" id="result-gems"></div>
        <button class="submit-btn" id="btn-goto-cat">去看看火类目的宝贝</button>
        <button class="submit-btn ghost" id="btn-copy-hs">复制推荐语</button>
      </div>
    </div>
    <div class="tabbar">
      <div class="tab" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>首页</div>
      <div class="tab" data-tab="cat"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>分类</div>
      <div class="tab on" data-tab="mine"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>我的</div>
    </div>
  </div>
</div>

<div class="copy-tip" id="copy-tip">推荐语已复制，发给客户</div>

<script>
// ===== 五行类目数据（与 wuxing_rules.json 对应）=====
const CATS = {

function copyText(txt, msg) {
  const done = () => {
    const tip = document.getElementById('copy-tip');
    tip.textContent = msg;
    tip.classList.add('show');
    setTimeout(() => tip.classList.remove('show'), 1800);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done).catch(() => fallbackCopy(txt, done));
  } else {
    fallbackCopy(txt, done);
  }
}

function fallbackCopy(txt, done) {
  const ta = document.createElement('textarea');
  ta.value = txt;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch (e) {}
  document.body.removeChild(ta);
}

    tip.textContent = '请输入 1924-2043 之间的出生年份';

  const tgIdx = ((y - 4) % 10 + 10) % 10;
  const sxIdx = ((y - 4) % 12 + 12) % 12;
  const tg = TIANGAN_NAMES[tgIdx];
